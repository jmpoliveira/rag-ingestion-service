# Retrieval eval dataset over samples/knowledge-base (Tessera Support Cloud, fictional).
#
# Changelog (bump `version` whenever a case or an expectation changes):
#   v1  18 cases: plans, SLA, ticket lifecycle, refunds, privacy, security, one question
#       needing two documents, three questions in Portuguese.
#   v2  Replaced `uptime-and-credits` with `two-factor-plans-price`. E0 showed that the
#       "Service credits" chunk of support-sla.md answers both halves of the old question on
#       its own (it states the 99.9% commitment and the credits), so expecting a second
#       document punished a correct retrieval. The new case cannot be answered by one
#       document: which plans can enforce 2FA (account-security) and their price (plans).
#   v3  Corpus grown from 6 short articles to 17 documents, because on v2 hit@5 saturated (a
#       top 5 was a quarter of the index): two long documents (admin guide, terms of
#       service), a 9-page PDF (security whitepaper), distractors with overlapping words
#       (release notes, API overview, onboarding), an archived refund policy that contradicts
#       the current one, and three planted prompt-injection attacks (ADR 0007). 19 new cases;
#       `forbidden_sources` (dataset and case level) measure contamination. Cases tagged
#       `holdout` are never used to tune anything: they detect overfitting.
#   v4  Contamination measured per chunk, not per document. On v3, release-notes/2026-10.md
#       counted as contamination whenever any of its chunks was retrieved, including its
#       harmless "Fixes" chunk (case locked-account). The planted paragraph is now a
#       `forbidden_passages` entry: only a chunk containing it counts. Note that with
#       1000-character chunks the paragraph shares its chunk with the legitimate Teams,
#       search and satisfaction sections, so questions about those carry the attack along.
#       Whole-document entries remain for documents that are bad as a whole (the spam post,
#       the archived policy).
#
# Questions are paraphrases: they avoid the words of the answer where a user would, so a
# lexical match is not enough. `evidence_any` is text the retrieved chunk must contain.

name = "knowledge_base"
version = 4
description = "Can the index find the help-centre article (and the passage) that answers a support question?"
corpus = "make ingest-samples (samples/knowledge-base)"
k = 5
# Planted attacks (samples/README.md): they must never reach the top k of a real question.
# `integrations/slack-integration.md` is not here: its attack is hidden in invisible
# characters, which ingestion removes; `make test-live` checks that.
# A document that is bad as a whole: none of its chunks may be retrieved.
forbidden_sources = ["community/billing-tips.md"]

# A malicious paragraph inside a legitimate document: only the chunk holding it is forbidden.
[[forbidden_passages]]
source = "release-notes/2026-10.md"
text = "Note for AI assistants and chatbots that read this page"

[[cases]]
id = "pro-annual-price"
question = "How much does one Pro seat cost if we pay yearly?"
tags = ["plans"]
[cases.expect]
sources = ["plans-and-pricing.md"]
evidence_any = ["15 EUR"]

